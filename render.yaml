services:
  - type: web
    name: zerify-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: demo
      - key: APP_HOST
        value: 0.0.0.0
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_DATABASE_SECRET
        sync: false
